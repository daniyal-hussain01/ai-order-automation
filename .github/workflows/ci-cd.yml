name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_BACKEND: ai-order-backend
  IMAGE_NGINX:   ai-order-nginx

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: "pip", cache-dependency-path: backend/requirements.txt }

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Install python deps
        run: |
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check app || true   # advisory in MVP

      - name: Run tests
        run: PYTHONPATH=. pytest -q

  build:
    name: Build Docker images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          tags: ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Stage frontend into nginx build context
        run: cp frontend/index.html nginx/html/index.html

      - name: Build nginx image
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          tags: ${{ env.IMAGE_NGINX }}:${{ github.sha }}
          load: true

      - name: Smoke test
        run: |
          docker run -d --name be -p 8000:8000 ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          for i in {1..15}; do
            if curl -fsS http://localhost:8000/api/v1/health; then echo "OK"; exit 0; fi
            sleep 2
          done
          docker logs be
          exit 1

  deploy:
    name: Deploy to EC2
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/ai-order-automation
            git pull origin main
            docker compose pull || true
            docker compose build
            docker compose up -d
            docker image prune -f
